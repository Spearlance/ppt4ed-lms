<svg width="80" height="79" viewBox="0 0 80 79" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark blue rounded rectangle background -->
  <rect width="80" height="79" rx="16" fill="#0b6685"/>
  <!-- Person/plant icon in light blue, centered -->
  <!-- Body stem -->
  <rect x="37" y="42" width="6" height="22" fill="#00a7c5" rx="3"/>
  <!-- Arms crossbar -->
  <rect x="24" y="40" width="32" height="6" fill="#00a7c5" rx="3"/>
  <!-- Head -->
  <circle cx="40" cy="32" r="6" fill="#00a7c5"/>
  <!-- Radiating petals above head -->
  <!-- Center top -->
  <ellipse cx="40" cy="20" rx="4" ry="7" fill="#00a7c5"/>
  <!-- Left petal -->
  <ellipse cx="29" cy="24" rx="4" ry="7" fill="#00a7c5" transform="rotate(-40 29 24)"/>
  <!-- Right petal -->
  <ellipse cx="51" cy="24" rx="4" ry="7" fill="#00a7c5" transform="rotate(40 51 24)"/>
</svg>
